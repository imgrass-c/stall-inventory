    function exportToCsv(filename, headers, rows) {
      const csvContent = "\uFEFF" + [
        headers.join(','),
        ...rows.map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
      ].join('\r\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function compressImageFile(file, maxDimension = 360, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = document.createElement('img');
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h) {
              if (w > maxDimension) {
                h = Math.round((h * maxDimension) / w);
                w = maxDimension;
              }
            } else {
              if (h > maxDimension) {
                w = Math.round((w * maxDimension) / h);
                h = maxDimension;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    class RealtimeService {
      constructor() {

      init() {
        let conf = null;
        if (window.STALL_CONFIG && window.STALL_CONFIG.FIREBASE_CONFIG && window.STALL_CONFIG.FIREBASE_CONFIG.projectId) {
          conf = window.STALL_CONFIG.FIREBASE_CONFIG;
        } else {
          try {
            const stored = localStorage.getItem(STORAGE_KEYS.FIREBASE_CONFIG);
            if (stored) conf = JSON.parse(stored);

        }

        if (conf && conf.projectId && conf.apiKey && window.firebase) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(conf);
            }
            this.db = firebase.firestore();
            this.auth = firebase.auth();
            this.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
            this.isFirebaseReady = true;
          } catch(e) {
            console.error("Firebase init error:", e);
          }
        }

      async deleteInventoryItem(skuId) {
        if (this.isFirebaseReady && this.db) {
          const invRef = this.db.collection('inventory_master').doc(skuId);
          const doc = await invRef.get();
          let productId = null;
          if (doc.exists) {
            productId = doc.data().product_id;
          }
          await invRef.delete();

          // 若該商品已無其他規格，則自動刪除商品母檔
          if (productId) {
            const remSnap = await this.db.collection('inventory_master').where('product_id', '==', productId).get();
            if (remSnap.empty) {
              await this.db.collection('products').doc(productId).delete().catch(() => {});
            }
          }
          return { success: true };
        } else {
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          let products = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PRODUCTS) || '[]');
          const target = inventory.find(i => i.sku_id === skuId);
          const productId = target ? target.product_id : null;

          inventory = inventory.filter(i => i.sku_id !== skuId);
          if (productId && !inventory.some(i => i.product_id === productId)) {
            products = products.filter(p => p.product_id !== productId);
            localStorage.setItem(STORAGE_KEYS.LOCAL_PRODUCTS, JSON.stringify(products));
          }
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          return { success: true };
        }
      }

      async deleteProduct(productId) {
        if (this.isFirebaseReady && this.db) {
          const batch = this.db.batch();
          batch.delete(this.db.collection('products').doc(productId));
          const invSnap = await this.db.collection('inventory_master').where('product_id', '==', productId).get();
          invSnap.forEach(d => batch.delete(d.ref));
          await batch.commit();
          return { success: true };
        } else {
          let products = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PRODUCTS) || '[]');
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          products = products.filter(p => p.product_id !== productId);
          inventory = inventory.filter(i => i.product_id !== productId);
          localStorage.setItem(STORAGE_KEYS.LOCAL_PRODUCTS, JSON.stringify(products));
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          return { success: true };
        }

      async clearAllTestData(options = { clearProducts: true, clearInventory: true, clearSales: true }) {
        if (options.clearProducts) localStorage.setItem(STORAGE_KEYS.LOCAL_PRODUCTS, '[]');
        if (options.clearInventory) localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, '[]');
        if (options.clearSales) localStorage.setItem(STORAGE_KEYS.LOCAL_SALES, '[]');

        if (this.isFirebaseReady && this.db) {
          const collectionsToClear = [];
          if (options.clearProducts) collectionsToClear.push('products');
          if (options.clearInventory) collectionsToClear.push('inventory_master');
          if (options.clearSales) collectionsToClear.push('sales_orders');

          for (const colName of collectionsToClear) {
            try {
              const snap = await this.db.collection(colName).get();
              if (!snap.empty) {
                const docs = [...snap.docs];
                while (docs.length > 0) {
                  const chunk = docs.splice(0, 400);
                  const batch = this.db.batch();
                  chunk.forEach(doc => batch.delete(doc.ref));
                  await batch.commit();
                }
              }
            } catch (err) {
              console.error(`清空集合 ${colName} 錯誤:`, err);
              throw new Error(`無法刪除雲端 ${colName}：${err.message}`);
            }
          }
        }
        return { success: true };
      }

      async loginWithGooglePopup() {
        if (!this.isFirebaseReady || !this.auth) {
          throw new Error("尚未設定 Firebase Config，請先使用下方「信箱快速登入」或至對接設定載入設定檔。");
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await this.auth.signInWithPopup(provider);
          const user = result.user;
          return await this.verifyUser(user.email, user.displayName, user.photoURL);
        } catch (err) {
          const currentHost = window.location.hostname || '目前網域';
          if (err.code === 'auth/unauthorized-domain') {
            throw new Error(`目前網域「${currentHost}」尚未加入 Firebase 授權網域！\n\n【30秒解決方式】：\n1. 前往 Firebase 控制台 -> Authentication\n2. 點選「設定 (Settings)」分頁 ->「授權網域 (Authorized domains)」\n3. 點「新增網域」並輸入「${currentHost}」即可！\n\n或是您也可以直接使用下方的「Google Email 表單」登入！`);
          } else if (err.code === 'auth/configuration-not-found') {
            throw new Error("您的 Firebase 尚未啟用 Google 登入。\n請至 Firebase 控制台 -> Authentication -> 登入方式 -> 啟用「Google」，或直接使用下方的「信箱快速驗證」即可！");
          } else if (err.code === 'auth/popup-closed-by-user') {
            throw new Error("登入視窗已關閉");
          } else {
            throw new Error(err.message || 'Google 登入發生錯誤');
          }
        }
      }

      async verifyUser(email, name = '', photo = '') {
        const cleanEmail = email.trim().toLowerCase();
        if (this.isFirebaseReady && this.db) {
          const userRef = this.db.collection('users').doc(cleanEmail);
          const doc = await userRef.get();
          
          if (doc.exists) {
            const data = doc.data();
            const userObj = {
              email: cleanEmail,
              name: data.name || name || cleanEmail.split('@')[0],
              picture: data.picture || photo,
              role: data.role || '一般使用者',
              status: data.status || '待審核'
            };
            return { success: true, user: userObj, status: userObj.status };
          } else {
            const allUsersSnap = await this.db.collection('users').get();
            const isFirstUser = allUsersSnap.empty;
            const newUserData = {
              email: cleanEmail,
              name: name || cleanEmail.split('@')[0],
              picture: photo || '',
              role: isFirstUser ? '系統管理者' : '一般使用者',
              status: isFirstUser ? '已核准' : '待審核',
              created_at: new Date().toISOString()
            };
            await userRef.set(newUserData);
            return { success: true, user: newUserData, status: newUserData.status, isNew: true };
          }
        } else {
          let users = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_USERS) || '[]');
          let found = users.find(u => u.email.toLowerCase() === cleanEmail);
          if (!found) {
            found = {
              email: cleanEmail,
              name: name || cleanEmail.split('@')[0],
              role: users.length === 0 ? '系統管理者' : '一般使用者',
              status: users.length === 0 ? '已核准' : '待審核'
            };
            users.push(found);
            localStorage.setItem(STORAGE_KEYS.LOCAL_USERS, JSON.stringify(users));
          }
          return { success: true, user: found, status: found.status };
        }
      }

      async checkoutSale(orderPayload) {
        const now = new Date();
        const orderId = "SALE-" + UtilitiesFormatDate(now) + "-" + Math.floor(Math.random()*1000);
        const orderData = {
          order_id: orderId,
          ...orderPayload,
          status: "有效",
          timestamp: now.toISOString()
        };

        if (this.isFirebaseReady && this.db) {
          const batch = this.db.batch();
          orderPayload.items.forEach(item => {
            const invRef = this.db.collection('inventory_master').doc(item.skuId);
            batch.update(invRef, {
              stall_qty: firebase.firestore.FieldValue.increment(-item.qty),
              total_qty: firebase.firestore.FieldValue.increment(-item.qty),
              updated_at: now.toISOString()
            });
          });
          const saleRef = this.db.collection('sales_orders').doc(orderId);
          batch.set(saleRef, orderData);
          await batch.commit();
          return { success: true, orderId, finalAmount: orderPayload.finalAmount };
        } else {
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          let sales = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_SALES) || '[]');
          orderPayload.items.forEach(ci => {
            const match = inventory.find(i => i.sku_id === ci.skuId);
            if (match) {
              match.stall_qty = Math.max(0, match.stall_qty - ci.qty);
              match.total_qty = match.home_qty + match.stall_qty;
            }
          });
          sales.push(orderData);
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          localStorage.setItem(STORAGE_KEYS.LOCAL_SALES, JSON.stringify(sales));
          return { success: true, orderId, finalAmount: orderPayload.finalAmount };
        }
      }

      async transferStock(transferPayload) {
        const now = new Date().toISOString();
        if (this.isFirebaseReady && this.db) {
          const batch = this.db.batch();
          transferPayload.transfers.forEach(tr => {
            const invRef = this.db.collection('inventory_master').doc(tr.skuId);
            const q = Number(tr.qty)||0;
            batch.update(invRef, {
              home_qty: firebase.firestore.FieldValue.increment(tr.direction === 'home_to_stall' ? -q : q),
              stall_qty: firebase.firestore.FieldValue.increment(tr.direction === 'home_to_stall' ? q : -q),
              updated_at: now
            });
          });
          await batch.commit();
          return { success: true };
        } else {
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          transferPayload.transfers.forEach(tr => {
            const it = inventory.find(i => i.sku_id === tr.skuId);
            if (it) {
              const q = Number(tr.qty)||0;
              if (tr.direction === 'home_to_stall') { it.home_qty = Math.max(0, it.home_qty - q); it.stall_qty += q; }
              else { it.home_qty += q; it.stall_qty = Math.max(0, it.stall_qty - q); }
              it.total_qty = it.home_qty + it.stall_qty;
            }
          });
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          return { success: true };
        }
      }

      async addProductWithVariants(payload) {
        const pid = "PROD-" + Date.now().toString().slice(-6);
        const owner = (payload.owner_name || payload.operator || '共同').trim();
        const prodData = {
          product_id: pid,
          name: payload.name,
          category: payload.category,
          base_price: Number(payload.basePrice),
          cost: Number(payload.cost || payload.baseCost || 0),
          color_tag: payload.colorTag || "#3B82F6",
          image_url: payload.image_url || "",
          owner_name: owner,
          created_by: payload.operator || "",
          status: "active",
          created_at: new Date().toISOString()
        };

        const variantDocs = (payload.variants || []).map((v, i) => {
          const vName = (v.variantName || "").trim() || ("規格 " + (i + 1));
          const h = Number(v.homeQty) || 0, s = Number(v.stallQty) || 0;
          const vCost = Number(v.cost) > 0 ? Number(v.cost) : (Number(payload.cost || payload.baseCost) || 0);
          return {
            sku_id: `${pid}-${encodeURIComponent(vName).replace(/%/g, "")}`,
            product_id: pid,
            product_name: payload.name,
            category: payload.category,
            variant_name: vName,
            cost: vCost,
            price: Number(v.price) > 0 ? Number(v.price) : Number(payload.basePrice),
            home_qty: h,
            stall_qty: s,
            total_qty: h + s,
            safety_stock: Number(v.safetyStock) || 2,
            image_url: payload.image_url || "",
            owner_name: owner,
            created_by: payload.operator || "",
            updated_at: new Date().toISOString()
          };
        });

        if (this.isFirebaseReady && this.db) {
          const batch = this.db.batch();
          batch.set(this.db.collection('products').doc(pid), prodData);
          variantDocs.forEach(v => batch.set(this.db.collection('inventory_master').doc(v.sku_id), v));
          await batch.commit();
          return { success: true, productId: pid };
        } else {
          let products = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PRODUCTS) || '[]');
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          products.push(prodData);
          inventory.push(...variantDocs);
          localStorage.setItem(STORAGE_KEYS.LOCAL_PRODUCTS, JSON.stringify(products));
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          return { success: true, productId: pid };
        }
      }

      calculateSalesStats(salesList = []) {
        const valid = salesList.filter(s => s.status !== '已作廢');
        let rev = 0, totalCost = 0, itemsCount = 0;
        let pmObj = { "現金": 0, "LinePay": 0, "街口": 0, "轉帳": 0, "公關贈送": 0 };
        let ranks = {};
        let ownerBreakdown = {};
        let dailyMap = {};
        let eventMap = {};

        valid.forEach(s => {
          const pm = s.paymentMethod || s.payment_method || '現金';
          const isPRGift = (pm === '公關贈送');
          const orderTotalAmount = Number(s.totalAmount || s.total_amount || 0);
          const orderFinalAmount = isPRGift ? 0 : Number(s.finalAmount !== undefined ? s.finalAmount : (s.final_amount !== undefined ? s.final_amount : (orderTotalAmount - Number(s.discountAmount || s.discount_amount || 0))));
          
          rev += orderFinalAmount;
          pmObj[pm] = (pmObj[pm] || 0) + orderFinalAmount;

          const discountRatio = (orderTotalAmount > 0) ? (orderFinalAmount / orderTotalAmount) : (isPRGift ? 0 : 1);
          const sDate = s.timestamp ? formatTaiwanTime(s.timestamp, 'date') : (s.date || '未知日期');
          const sEvent = s.eventName || s.event_name || '一般現場';

          // 每日匯總
          if (!dailyMap[sDate]) {
            dailyMap[sDate] = {
              date: sDate,
              eventName: sEvent,
              totalOrders: 0,
              totalItems: 0,
              revenue: 0,
              cost: 0,
              profit: 0,
              cashRevenue: 0,
              digitalRevenue: 0
            };
          }
          dailyMap[sDate].totalOrders += 1;
          dailyMap[sDate].revenue += orderFinalAmount;
          if (pm === '現金') {
            dailyMap[sDate].cashRevenue += orderFinalAmount;
          } else if (!isPRGift) {
            dailyMap[sDate].digitalRevenue += orderFinalAmount;
          }

          // 活動場次匯總
          if (!eventMap[sEvent]) {
            eventMap[sEvent] = {
              eventName: sEvent,
              totalOrders: 0,
              totalItems: 0,
              revenue: 0,
              cost: 0,
              profit: 0
            };
          }
          eventMap[sEvent].totalOrders += 1;
          eventMap[sEvent].revenue += orderFinalAmount;

          (s.items || []).forEach(it => {
            const q = Number(it.qty) || 1;
            const originalPrice = Number(it.price) || 0;
            const itemCost = Number(it.cost) || 0;
            const itemRealSubtotal = isPRGift ? 0 : Math.round(originalPrice * q * discountRatio);
            const itemTotalCost = itemCost * q;
            const itemProfit = itemRealSubtotal - itemTotalCost;

            totalCost += itemTotalCost;
            itemsCount += q;
            dailyMap[sDate].totalItems += q;
            dailyMap[sDate].cost += itemTotalCost;
            dailyMap[sDate].profit += itemProfit;

            eventMap[sEvent].totalItems += q;
            eventMap[sEvent].cost += itemTotalCost;
            eventMap[sEvent].profit += itemProfit;

            const k = `${it.productName || '商品'} (${it.variantName || '一般'})`;
            ranks[k] = (ranks[k] || 0) + q;

            // 雙主理人分帳統計
            const owner = (it.owner_name || '共同/未指定').trim();
            if (!ownerBreakdown[owner]) {
              ownerBreakdown[owner] = { totalRevenue: 0, totalCost: 0, totalProfit: 0, totalQty: 0, items: {}, salesRecords: [] };
            }
            ownerBreakdown[owner].totalRevenue += itemRealSubtotal;
            ownerBreakdown[owner].totalCost += itemTotalCost;
            ownerBreakdown[owner].totalProfit += itemProfit;
            ownerBreakdown[owner].totalQty += q;
            ownerBreakdown[owner].items[k] = (ownerBreakdown[owner].items[k] || 0) + q;

            // 儲存單一銷售詳細紀錄 (含時間、品項、原價、實收、折讓、支付方式)
            ownerBreakdown[owner].salesRecords.push({
              orderId: s.order_id || s.orderId,
              timestamp: s.timestamp,
              date: sDate,
              eventName: sEvent,
              productName: it.productName || '商品',
              variantName: it.variantName || '一般',
              qty: q,
              originalPrice: originalPrice,
              realSubtotal: itemRealSubtotal,
              discount: Math.round((originalPrice * q) - itemRealSubtotal),
              cost: itemCost,
              paymentMethod: pm,
              operator: s.operator || '小幫手'
            });
          });
        });

        const rankingList = Object.keys(ranks).map(k => ({ name: k, qty: ranks[k] })).sort((a,b) => b.qty - a.qty);
        const dailyList = Object.values(dailyMap).sort((a, b) => b.date.localeCompare(a.date));
        const eventList = Object.values(eventMap).sort((a, b) => b.revenue - a.revenue);
        const totalProfit = rev - totalCost;
        const profitMargin = rev > 0 ? ((totalProfit / rev) * 100).toFixed(1) : 0;

        return {
          success: true,
          totalRevenue: rev,
          totalCost: totalCost,
          totalProfit: totalProfit,
          profitMargin: profitMargin,
          totalOrders: valid.length,
          totalItemsSold: itemsCount,
          paymentBreakdown: pmObj,
          ownerBreakdown: ownerBreakdown,
          itemRanking: rankingList,
          dailyBreakdown: dailyList,
          eventBreakdown: eventList,
          recentSales: [...salesList].reverse()
        };
      }

      async getTodaySales() {
        const todayStr = formatTaiwanTime(new Date(), 'date');
        const sales = await this.getAllSalesRaw();
        const todaySales = sales.filter(s => {
          const sDate = s.timestamp ? formatTaiwanTime(s.timestamp, 'date') : (s.date || '');
          return sDate === todayStr;
        });
        const res = this.calculateSalesStats(todaySales);
        res.date = todayStr;
        return res;
      }

      async getMonthSales(targetMonth) {
        const mStr = targetMonth || formatTaiwanTime(new Date(), 'date').slice(0, 7); // e.g. "2026-08"
        const sales = await this.getAllSalesRaw();
        const monthSales = sales.filter(s => {
          const sDate = s.timestamp ? formatTaiwanTime(s.timestamp, 'date') : (s.date || '');
          return sDate.startsWith(mStr);
        });
        const res = this.calculateSalesStats(monthSales);
        res.month = mStr;
        return res;
      }

      async getEventSales(targetEvent) {
        const sales = await this.getAllSalesRaw();
        const eventSales = (!targetEvent || targetEvent === 'ALL')
          ? sales
          : sales.filter(s => (s.eventName || s.event_name || '一般現場') === targetEvent);
        const res = this.calculateSalesStats(eventSales);
        res.eventName = targetEvent || 'ALL';
        return res;
      }

      async getAllEvents() {
        const sales = await this.getAllSalesRaw();
        const set = new Set();
        sales.forEach(s => {
          const ev = s.eventName || s.event_name || '一般現場';
          if (ev) set.add(ev);
        });
        return Array.from(set);
      }

      async saveDailyReport(eodData) {
        const dateStr = eodData.date || formatTaiwanTime(new Date(), 'date');
        const reportId = `REPORT-${dateStr}`;
        const record = {
          report_id: reportId,
          date: dateStr,
          eventName: eodData.eventName || '一般現場',
          total_items: eodData.totalItemsSold || 0,
          total_orders: eodData.totalOrders || 0,
          daily_revenue: eodData.totalRevenue || 0,
          daily_cost: eodData.totalCost || 0,
          daily_profit: eodData.totalProfit || 0,
          profit_margin: eodData.profitMargin || 0,
          cash_revenue: eodData.paymentBreakdown?.['現金'] || 0,
          digital_revenue: (eodData.totalRevenue || 0) - (eodData.paymentBreakdown?.['現金'] || 0),
          closed_by: eodData.operator || '攤主',
          closed_at: new Date().toISOString()
        };

        if (this.isFirebaseReady && this.db) {
          await this.db.collection('daily_reports').doc(reportId).set(record);
        }
        let reports = JSON.parse(localStorage.getItem('stall_daily_reports') || '[]');
        reports = reports.filter(r => r.report_id !== reportId);
        reports.unshift(record);
        localStorage.setItem('stall_daily_reports', JSON.stringify(reports));

        return { success: true, report: record };
      }

      async voidSale(orderId, operator) {
        if (this.isFirebaseReady && this.db) {
          const saleRef = this.db.collection('sales_orders').doc(orderId);
          const doc = await saleRef.get();
          if (!doc.exists) return { success: false, error: "找不到訂單" };
          const saleData = doc.data();
          if (saleData.status === '已作廢') return { success: false, error: "訂單已作廢" };

          const batch = this.db.batch();
          batch.update(saleRef, { status: "已作廢", voided_by: operator, voided_at: new Date().toISOString() });
          (saleData.items || []).forEach(it => {
            const invRef = this.db.collection('inventory_master').doc(it.skuId);
            batch.update(invRef, {
              stall_qty: firebase.firestore.FieldValue.increment(it.qty),
              total_qty: firebase.firestore.FieldValue.increment(it.qty),
              updated_at: new Date().toISOString()
            });
          });
          await batch.commit();
          return { success: true };
        } else {
          let sales = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_SALES) || '[]');
          let inventory = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_INVENTORY) || '[]');
          const target = sales.find(s => s.order_id === orderId);
          if (!target || target.status === '已作廢') return { success: false };
          target.status = '已作廢';
          (target.items || []).forEach(it => {
            const inv = inventory.find(i => i.sku_id === it.skuId);
            if (inv) {
              inv.stall_qty += Number(it.qty) || 1;
              inv.total_qty = inv.home_qty + inv.stall_qty;
            }
          });
          localStorage.setItem(STORAGE_KEYS.LOCAL_SALES, JSON.stringify(sales));
          localStorage.setItem(STORAGE_KEYS.LOCAL_INVENTORY, JSON.stringify(inventory));
          return { success: true };
        }
      }

      subscribeSales(onUpdate) {
        if (this.isFirebaseReady && this.db) {
          return this.db.collection('sales_orders').onSnapshot(() => {
            this.getTodaySales().then(res => onUpdate(res)).catch(() => {});
          }, () => {
            this.getTodaySales().then(res => onUpdate(res)).catch(() => {});
          });
        } else {
          this.getTodaySales().then(res => onUpdate(res)).catch(() => {});
          return () => {};
        }
      }

      async syncToGoogleSheets(targetType = 'all') {
        const gasUrl = this.getGasUrl();
        if (!gasUrl) throw new Error("請先在「對接與備份設定」中設定 Google Apps Script URL！");

        let products = [], inventory = [], users = [], sales = [], dailyReports = [];
        if (this.isFirebaseReady && this.db) {
          const pSnap = await this.db.collection('products').get();
          pSnap.forEach(d => products.push(d.data()));

          const iSnap = await this.db.collection('inventory_master').get();
          iSnap.forEach(d => inventory.push(d.data()));

          const uSnap = await this.db.collection('users').get();
          uSnap.forEach(d => users.push(d.data()));

          const sSnap = await this.db.collection('sales_orders').get();
          sSnap.forEach(d => sales.push(d.data()));

          const drSnap = await this.db.collection('daily_reports').get();
          drSnap.forEach(d => dailyReports.push(d.data()));
        } else {
          const l = this.getLocalData();
          products = l.products;
          inventory = l.inventory;
          users = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_USERS) || '[]');
          sales = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_SALES) || '[]');
          dailyReports = JSON.parse(localStorage.getItem('stall_daily_reports') || '[]');
        }

        const payload = {
          action: 'fullSyncBackup',
          targetType: 'all', // 一律全表完整同步，確保商品、規格、銷售、日結、成員雙向關聯完整無遺漏
          products,
          inventory,
          sales,
          dailyReports,
          users,
          timestamp: new Date().toISOString()
        };

        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          try {
            const data = JSON.parse(text);
            if (data && data.success === false) {
              throw new Error(data.error || "Google 試算表執行錯誤");
            }
            return data;
          } catch(e) {
            if (res.ok || text.includes('success')) {
              return { success: true, message: "Google 試算表備份同步成功！" };
            }
            throw new Error(`Google 試算表回應異常：${text.slice(0, 150)}`);
          }
        } catch (err) {
          console.error("同步 Google Sheet 錯誤:", err);
          if (err.message && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.message.includes('CORS'))) {
            throw new Error(`無法連線至 Google 試算表！\n\n【30秒解決方式】：\n1. 前往您的 Google 試算表 -> 擴充功能 -> Apps Script\n2. 點選右上角「部署」->「管理部署作業」\n3. 點選鉛筆圖示編輯，確認「誰可以存取」設為【所有人 (Anyone)】！\n4. 版本選擇【新版本 (New Version)】後點「部署」即可！`);
          }
          throw err;
        }
      }

    function UtilitiesFormatDate(d) {
      return d.getFullYear() +
        String(d.getMonth()+1).padStart(2,'0') +
        String(d.getDate()).padStart(2,'0') + "-" +
        String(d.getHours()).padStart(2,'0') +
        String(d.getMinutes()).padStart(2,'0') +
        String(d.getSeconds()).padStart(2,'0');
    }

    function formatTaiwanTime(ts, mode = 'time') {
      if (!ts) return '';
      const d = (ts instanceof Date) ? ts : new Date(ts);
      if (isNaN(d.getTime())) return String(ts);
      
      try {
        const formatter = new Intl.DateTimeFormat('zh-TW', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(d);
        const m = {};
        parts.forEach(p => m[p.type] = p.value);
        
        if (mode === 'date') return `${m.year}-${m.month}-${m.day}`;
        if (mode === 'time') return `${m.hour}:${m.minute}`;
        if (mode === 'time_sec') return `${m.hour}:${m.minute}:${m.second}`;
        if (mode === 'datetime') return `${m.year}/${m.month}/${m.day} ${m.hour}:${m.minute}`;
        if (mode === 'full') return `${m.year}/${m.month}/${m.day} ${m.hour}:${m.minute}:${m.second}`;
        return `${m.hour}:${m.minute}`;
      } catch (e) {
        const pad = n => String(n).padStart(2, '0');
        if (mode === 'date') return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        if (mode === 'time_sec') return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
    }

        if (pendingUser && pendingUser.email) {
          const unsub = realtime.listenUserStatus(pendingUser.email, (userData) => {
            if (userData && userData.status === '已核准') {
              realtime.setCurrentUser(userData);
              onLoginSuccess(userData);
            }
          });
          return () => unsub();
        }
      }, [pendingUser]);

      const handleGooglePopupLogin = async () => {
        setIsSubmitting(true);
        setErrorMsg('');
        try {
          const res = await realtime.loginWithGooglePopup();
          if (res && res.success) {
            if (res.status === '已核准') {
              realtime.setCurrentUser(res.user);
              onLoginSuccess(res.user);
            } else {
              setPendingUser(res.user);
            }
          }
        } catch (err) {
          setErrorMsg(err.message || 'Google 登入失敗');
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleManualEmailLogin = async (e) => {
        e.preventDefault();
        if (!emailInput.trim()) return;
        setIsSubmitting(true);
        setErrorMsg('');

          const res = await realtime.verifyUser(emailInput.trim(), nameInput.trim());
          if (res && res.success) {
            if (res.status === '已核准') {
              realtime.setCurrentUser(res.user);
              onLoginSuccess(res.user);

    // =========================================================================
    // 手機優先 POS 收銀模組 (Mobile POS Checkout Module)
    // =========================================================================
    function MobilePosSection({ products = [], inventory = [], onCheckout, user, onNavigateToProducts }) {
      const [category, setCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');
      const [currentEvent, setCurrentEvent] = useState(() => localStorage.getItem('stall_current_event') || '2026 現場出攤');
      const [cart, setCart] = useState([]);
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [paymentMethod, setPaymentMethod] = useState('現金');
      const [discount, setDiscount] = useState(0);
      const [cashGiven, setCashGiven] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [lastSuccess, setLastSuccess] = useState(null);
      const [previewImageModal, setPreviewImageModal] = useState(null);

      const categories = ['全部', ...new Set(products.map(p => p.category).filter(Boolean))];

      const productCards = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return products
          .filter(p => category === '全部' || p.category === category)
          .filter(p => {
            if (!q) return true;
            const matchName = (p.name || '').toLowerCase().includes(q);
            const matchCat = (p.category || '').toLowerCase().includes(q);
            const matchOwner = (p.owner_name || '').toLowerCase().includes(q);
            const matchVariant = inventory.some(inv => inv.product_id === p.product_id && (inv.variant_name || '').toLowerCase().includes(q));
            return matchName || matchCat || matchOwner || matchVariant;
          })
          .map(p => ({
            ...p,
            variants: inventory.filter(inv => inv.product_id === p.product_id)
          }));
      }, [products, inventory, category, searchQuery]);

      const addToCart = (v, p) => {
        setCart(prev => {
          const ex = prev.find(i => i.skuId === v.sku_id);
          if (ex) return prev.map(i => i.skuId === v.sku_id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, {
            skuId: v.sku_id,
            productId: p.product_id,
            productName: p.name,
            variantName: v.variant_name,
            price: Number(v.price)||Number(p.base_price)||0,
            cost: Number(v.cost)||Number(p.cost)||0,
            image_url: p.image_url || "",
            owner_name: p.owner_name || v.owner_name || '共同',
            qty: 1
          }];
        });
      };

      const updateQty = (skuId, d) => {
        setCart(prev => prev.map(i => i.skuId === skuId ? { ...i, qty: i.qty + d } : i).filter(i => i.qty > 0));
      };

      const isPRGift = paymentMethod === '公關贈送';
      const totalItems = cart.reduce((s, i) => s + i.qty, 0);
      const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const effectiveDiscount = isPRGift ? subtotal : Math.min(subtotal, Math.max(0, Number(discount) || 0));
      const finalAmount = isPRGift ? 0 : Math.max(0, subtotal - effectiveDiscount);
      const changeDue = paymentMethod === '現金' && cashGiven ? Number(cashGiven) - finalAmount : null;

      const doCheckout = async () => {
        if (cart.length === 0 || isSubmitting) return;
        setIsSubmitting(true);
        try {
          const res = await onCheckout({
            items: cart,
            totalAmount: subtotal,
            discountAmount: effectiveDiscount,
            finalAmount,
            paymentMethod,
            eventName: currentEvent || '一般現場',
            operator: user ? user.name : '現場小幫手'
          });
          if (res && res.success) {
            setLastSuccess({ orderId: res.orderId, amount: finalAmount, changeDue: changeDue > 0 ? changeDue : 0 });
            setCart([]);
            setDiscount(0);
            setCashGiven('');
            setIsDrawerOpen(false);
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      if (products.length === 0) {
        return (
          <div className="max-w-md mx-auto my-12 p-8 text-center bg-white rounded-3xl border border-slate-200 shadow-card space-y-4 animate-in fade-in">
            <div className="w-16 h-16 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto">
              <Icons.Products className="w-8 h-8" />
            </div>
            <div>
              <h3 className="text-base font-black text-slate-900">目前尚無商品資料</h3>
              <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                資料庫已成功清空為乾淨空白狀態。<br />請前往商品管理建立您的第一筆商品！
              </p>
            </div>
            {['系統管理者', '編輯者'].includes(user?.role) && (
              <button
                onClick={onNavigateToProducts}
                className="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-2xl text-xs transition shadow-md flex items-center justify-center gap-1.5"

      return (
        <div className="space-y-3 max-w-5xl mx-auto pb-24">
          
          {previewImageModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4 animate-in fade-in" onClick={() => setPreviewImageModal(null)}>

                <button

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">

                      <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">

                        {p.name}

                  <div className="text-right flex-shrink-0">

                <div className="space-y-1.5 pt-2 border-t border-slate-100">
                  <div className="text-[11px] font-bold text-slate-400 flex justify-between">
                    <span>點擊規格直接加單</span>
                    <span>現場庫存 / 家內庫存</span>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    {p.variants.map(v => {
                      const isZero = v.stall_qty <= 0;
                      return (
                        <button
                          key={v.sku_id}
                          onClick={() => addToCart(v, p)}
                          className={`h-14 rounded-xl border-2 transition active:scale-95 flex flex-col items-center justify-center shadow-btn-touch ${
                            isZero
                              ? 'bg-amber-50/60 border-amber-300 text-amber-900'
                              : 'bg-surface-50 border-slate-200 hover:border-rose-400 hover:bg-rose-50/40 text-slate-900'
                          }`}
                        >
                          <span className="font-black text-sm tracking-tight">{v.variant_name}</span>
                          <div className="flex items-center gap-1 text-[11px] mt-0.5">
                            <span className={`font-black ${isZero ? 'text-rose-600' : 'text-emerald-700'}`}>
                              現:{v.stall_qty}
                            </span>
                            <span className="text-slate-400 font-medium">家:{v.home_qty}</span>

                      );

                  </div>
                </div>

              </div>
            ))}
          </div>

          {cart.length > 0 && (
            <div className="fixed bottom-16 md:bottom-6 left-3 right-3 z-40 max-w-md mx-auto">
              <button
                onClick={() => setIsDrawerOpen(true)}
                className="w-full h-16 bg-slate-900 text-white rounded-2xl px-5 shadow-2xl flex items-center justify-between border-2 border-rose-500 active:scale-98 transition"
              >
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-rose-500 text-white flex items-center justify-center font-black text-base shadow-sm">
                    {totalItems}
                  </div>
                  <div className="text-left">
                    <div className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">合計金額</div>
                    <div className="text-xl font-black text-white">NT$ {finalAmount}</div>
                  </div>
                </div>

                <div className="flex items-center gap-1 text-sm font-black text-rose-400">
                  <span>明細與結帳</span>
                  <Icons.ChevronUp className="w-5 h-5 animate-bounce" />
                </div>
              </button>
            </div>
          )}

          {isDrawerOpen && (
            <div className="fixed inset-0 z-50 flex flex-col justify-end bg-slate-900/60 backdrop-blur-sm animate-in fade-in">
              <div className="bg-white rounded-t-3xl border-t border-slate-200 p-5 max-h-[90vh] overflow-y-auto shadow-drawer space-y-4 max-w-xl mx-auto w-full">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <Icons.Pos className="w-5 h-5 text-rose-500" />
                    <h3 className="text-lg font-black text-slate-900">結帳點單清單 ({totalItems} 件)</h3>
                  </div>
                  <button onClick={() => setIsDrawerOpen(false)} className="p-2 text-slate-400 hover:text-slate-800 rounded-full hover:bg-slate-100">
                    <Icons.Close className="w-6 h-6" />
                  </button>
                </div>

                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {cart.map(i => (
                    <div key={i.skuId} className="bg-surface-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                      <div className="flex items-center gap-2.5 min-w-0">
                        {i.image_url && (
                          <img src={i.image_url} alt="" className="w-9 h-9 rounded-lg object-cover border border-slate-200 flex-shrink-0" />
                        )}
                        <div className="min-w-0">
                          <div className="font-extrabold text-slate-900 text-sm truncate">{i.productName}</div>
                          <div className="text-xs text-slate-500 font-bold mt-0.5">
                            <span className="bg-white border border-slate-200 px-1.5 py-0.5 rounded mr-1 font-mono font-black text-slate-800">{i.variantName}</span>
                            NT$ {i.price}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <button
                          onClick={() => updateQty(i.skuId, -1)}
                          className="w-10 h-10 bg-white border border-slate-300 rounded-xl font-black text-slate-700 flex items-center justify-center active:scale-95 shadow-sm"
                        >
                          <Icons.Minus className="w-4 h-4" />
                        </button>
                        <span className="w-7 text-center font-black text-slate-900 text-base">{i.qty}</span>
                        <button
                          onClick={() => updateQty(i.skuId, 1)}
                          className="w-10 h-10 bg-white border border-slate-300 rounded-xl font-black text-slate-700 flex items-center justify-center active:scale-95 shadow-sm"
                        >
                          <Icons.Plus className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="space-y-3 pt-2 border-t border-slate-100 text-xs">
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <span className="text-slate-500 font-bold">折讓優惠 / 折扣：</span>
                      {isPRGift && (
                        <span className="text-amber-800 font-black bg-amber-100 px-2 py-0.5 rounded-md text-[11px] inline-flex items-center gap-1">
                          <Icons.Gift className="w-3.5 h-3.5 text-amber-700" />
                          <span>公關贈送中 (實收 NT$ 0)</span>
                        </span>
                      )}
                    </div>
                    {!isPRGift && (
                      <div className="space-y-1.5">
                        <div className="flex gap-1.5">
                          {[0, 10, 20, 50, 100, 150].map(v => (
                            <button
                              key={v}
                              type="button"
                              onClick={() => setDiscount(v)}
                              className={`flex-1 py-2.5 rounded-xl font-black text-xs border transition ${
                                Number(discount) === v ? 'bg-rose-50 border-rose-500 text-rose-600 font-bold shadow-sm' : 'bg-white border-slate-200 text-slate-700'
                              }`}
                            >
                              {v === 0 ? '無' : `-${v}`}
                            </button>
                          ))}
                        </div>
                        <div className="flex items-center gap-2 bg-surface-50 p-2 rounded-xl border border-slate-200">
                          <span className="text-[11px] text-slate-500 font-bold whitespace-nowrap">自訂折讓金額：</span>
                          <div className="relative flex-1">
                            <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-black text-rose-500">- NT$</span>
                            <input
                              type="number"
                              min="0"
                              max={subtotal}
                              placeholder="0"
                              value={discount || ''}
                              onChange={e => setDiscount(Math.max(0, Number(e.target.value) || 0))}
                              className="w-full bg-white border border-slate-200 rounded-lg pl-14 pr-2.5 py-1.5 text-xs font-black text-rose-600 focus:outline-none focus:border-rose-400"
                            />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div>
                    <span className="text-slate-500 font-bold block mb-1.5">支付方式：</span>
                    <div className="grid grid-cols-3 gap-1.5">
                      {['現金', 'LinePay', '街口', '轉帳', '公關贈送'].map(pm => (
                        <button
                          key={pm}
                          type="button"
                          onClick={() => setPaymentMethod(pm)}
                          className={`py-2.5 rounded-xl font-black text-xs border transition ${
                            paymentMethod === pm ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm font-bold' : 'bg-white border-slate-200 text-slate-700'
                          }`}
                        >
                          {pm}
                        </button>
                      ))}
                    </div>
                  </div>

                  {paymentMethod === '現金' && (
                    <div className="bg-surface-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                      <div className="flex justify-between items-baseline">
                        <span className="text-xs font-bold text-slate-500">實收現金找零計算：</span>
                        <span className="font-black text-slate-900 text-sm">
                          {changeDue !== null && (changeDue >= 0 ? `找零 NT$ ${changeDue}` : `尚缺 NT$ ${Math.abs(changeDue)}`)}
                        </span>
                      </div>
                      <div className="flex gap-2">
                        {[finalAmount, 500, 1000, 2000].filter(v => v >= finalAmount).map(val => (
                          <button
                            key={val}
                            onClick={() => setCashGiven(String(val))}
                            className="flex-1 py-3 bg-white border border-slate-200 rounded-xl text-xs font-black text-slate-800 active:scale-95 shadow-sm"
                          >
                            {val === finalAmount ? '剛好' : `$${val}`}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-2">
                  <button
                    onClick={doCheckout}
                    disabled={cart.length === 0 || isSubmitting}
                    className="w-full py-4 bg-rose-500 hover:bg-rose-600 disabled:bg-slate-200 text-white font-black rounded-2xl text-lg transition shadow-lg flex items-center justify-center gap-2"
                  >
                    {isSubmitting ? <Icons.Refresh className="w-6 h-6 animate-spin" /> : <><Icons.Check className="w-6 h-6" /><span>確認結帳扣庫 (NT$ {finalAmount})</span></>}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 即時庫存清點 (Realtime Inventory Management)
    // =========================================================================
    function InventorySection({ inventory = [], onSyncSheets, isAdmin, onClearData, onDeleteItem, onNavigateToProducts, user }) {
      const [search, setSearch] = useState('');
      const [expandedPartner, setExpandedPartner] = useState(null);

      const handleExportPartnerSalesCsv = (partnerName, records = []) => {
        const headers = ["訂單編號", "交易時間", "主理人", "商品名稱", "規格尺寸", "售出數量", "標價單價", "折讓", "實收分帳金額", "進貨成本", "毛利", "付款方式", "操作員"];
        const rows = records.map(r => [
          r.orderId || '',
          r.timestamp || '',
          partnerName,
          r.productName || '',
          r.variantName || '',
          r.qty || 1,
          r.originalPrice || 0,
          r.discount || 0,
          r.realSubtotal || 0,
          r.cost || 0,
          (r.realSubtotal || 0) - ((r.cost || 0) * (r.qty || 1)),
          r.paymentMethod || '現金',
          r.operator || ''
        ]);
        const dateStr = new Date().toISOString().slice(0, 10);
        exportToCsv(`感情失敗之友會_夥伴分帳明細_${partnerName}_${dateStr}.csv`, headers, rows);
      };
      const [isDeleting, setIsDeleting] = useState(null);

      const canManage = isAdmin || user?.role === '編輯者';

      const filtered = inventory.filter(i => (i.product_name||'').includes(search) || (i.variant_name||'').includes(search));
      const totalStall = inventory.reduce((s, i) => s + (Number(i.stall_qty)||0), 0);
      const totalHome = inventory.reduce((s, i) => s + (Number(i.home_qty)||0), 0);

      const handleSync = async () => {
        setSyncing(true);
        setSyncMsg('');
        try {
          const res = await onSyncSheets();
          if (res && res.success) {
            setSyncMsg('✅ 已成功將即時庫存存量同步更新至 Google 試算表！');
          } else {
            setSyncMsg('⚠️ 同步失敗：' + (res?.error || '請檢查 GAS 連線'));
          }
        } catch(e) {
          setSyncMsg('⚠️ 同步錯誤：' + e.message);
        } finally {
          setSyncing(false);
          setTimeout(() => setSyncMsg(''), 5000);
        }
      };

      const handleExportCsv = () => {
        const headers = ["SKU編號", "商品名稱", "分類", "商品歸屬攤主", "規格名稱", "售價", "現場庫存", "家內庫存", "總庫存", "安全庫存"];
        const rows = inventory.map(i => [
          i.sku_id,
          i.product_name,
          i.category,
          i.owner_name || '共同',
          i.variant_name,
          i.price,
          i.stall_qty,
          i.home_qty,
          i.total_qty || (Number(i.home_qty)+Number(i.stall_qty)),
          i.safety_stock || 2
        ]);
        const dateStr = new Date().toISOString().slice(0, 10);
        exportToCsv(`感情失敗之友會_即時庫存清冊_${dateStr}.csv`, headers, rows);
      };

      const handleClearClick = async () => {
        if (!confirm('⚠️ 確定要徹底清空所有庫存品項與商品資料嗎？')) return;
        await onClearData();
        setSyncMsg('🧹 已成功清空所有庫存資料！');
        setTimeout(() => setSyncMsg(''), 4000);
      };

      const handleDeleteSingleItem = async (item) => {
        const confirmText = `確定要刪除「${item.product_name} - ${item.variant_name}」嗎？\n\n⚠️ 刪除後此品項將從雲端庫存與收銀台徹底移除。`;
        if (!confirm(confirmText)) return;
        setIsDeleting(item.sku_id);
        try {
          await onDeleteItem(item.sku_id);
          setSyncMsg(`🗑️ 已成功刪除「${item.product_name} (${item.variant_name})」！`);
          setTimeout(() => setSyncMsg(''), 4000);
        } catch (err) {
          alert('刪除失敗：' + (err.message || '請確認權限'));
        } finally {
          setIsDeleting(null);
        }
      };

      return (
        <div className="space-y-4 max-w-5xl mx-auto">
          
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-lg font-black text-slate-900">即時庫存清點中樞</h2>
              <p className="text-xs text-slate-500 mt-0.5">即時掌握現場與家內雙庫存量</p>
            </div>

            <div className="flex items-center gap-2">
              {isAdmin && inventory.length > 0 && (
                <button
                  onClick={handleClearClick}
                  className="text-xs bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition"
                >
                  <Icons.Trash className="w-3.5 h-3.5 text-rose-600" />
                  <span>清空庫存</span>
                </button>
              )}

              <button
                onClick={handleExportCsv}
                disabled={inventory.length === 0}
                className="text-xs bg-white hover:bg-slate-50 disabled:opacity-40 border border-slate-200 text-slate-700 px-3.5 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow-sm transition"
              >
                <Icons.DownloadFile className="w-4 h-4 text-blue-600" />
                <span>匯出庫存 CSV</span>
              </button>

              {isAdmin && (
                <button
                  onClick={handleSync}
                  disabled={syncing || inventory.length === 0}
                  className="text-xs bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white px-3.5 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow-sm transition"
                >
                  <Icons.CloudSync className={`w-4 h-4 ${syncing ? 'animate-spin' : ''}`} />
                  <span>{syncing ? '同步中...' : '📥 同步庫存至 Google Sheet'}</span>
                </button>
              )}
            </div>
          </div>

          {syncMsg && (
            <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold rounded-xl flex items-center gap-2">
              <Icons.Check className="w-4 h-4 text-emerald-600" />
              <span>{syncMsg}</span>
            </div>
          )}

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-card">
              <div className="text-xs text-slate-500 font-bold">現場總庫存</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{totalStall} <span className="text-xs text-slate-400 font-normal">件</span></div>
            </div>
            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-card">
              <div className="text-xs text-slate-500 font-bold">家內總庫存</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{totalHome} <span className="text-xs text-slate-400 font-normal">件</span></div>
            </div>
            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-card">
              <div className="text-xs text-slate-500 font-bold">全體總合計</div>
              <div className="text-2xl font-black text-blue-600 mt-1">{totalStall + totalHome} <span className="text-xs text-slate-400 font-normal">件</span></div>
            </div>
            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-card">
              <div className="text-xs text-slate-500 font-bold">規格品項數</div>
              <div className="text-2xl font-black text-slate-900 mt-1">{inventory.length} <span className="text-xs text-slate-400 font-normal">項</span></div>
            </div>
          </div>

          {inventory.length > 0 ? (
            <>
              <div className="bg-white p-3 rounded-2xl border border-slate-200">
                <input
                  type="text"
                  placeholder="搜尋商品名稱、尺寸或規格..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  className="w-full bg-surface-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-rose-400"
                />
              </div>

              <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-card">
                <table className="w-full text-xs text-left">
                  <thead className="bg-surface-50 text-slate-500 font-bold border-b border-slate-200">
                    <tr>
                      <th className="py-3.5 px-4">商品與規格</th>
                      <th className="py-3.5 px-3 text-center">分類</th>
                      <th className="py-3.5 px-3 text-right">單價</th>
                      <th className="py-3.5 px-3 text-center">現場庫存</th>
                      <th className="py-3.5 px-3 text-center">家內庫存</th>
                      <th className="py-3.5 px-3 text-center">總庫存</th>
                      {canManage && <th className="py-3.5 px-3 text-center">操作</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filtered.map(i => (
                      <tr key={i.sku_id} className="hover:bg-surface-50 transition">
                        <td className="py-3.5 px-4">
                          <div className="font-extrabold text-slate-900 text-sm">{i.product_name}</div>
                          <span className="inline-block mt-0.5 bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-mono font-black text-xs border border-slate-200">{i.variant_name}</span>
                        </td>
                        <td className="py-3.5 px-3 text-center font-bold text-slate-500">{i.category}</td>
                        <td className="py-3.5 px-3 text-right font-black text-slate-900">NT$ {i.price}</td>
                        <td className="py-3.5 px-3 text-center">
                          <span className={`inline-block px-3 py-1 rounded-lg font-black text-xs ${i.stall_qty <= 0 ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                            {i.stall_qty}
                          </span>
                        </td>
                        <td className="py-3.5 px-3 text-center font-bold text-slate-600">{i.home_qty}</td>
                        <td className="py-3.5 px-3 text-center font-black text-slate-900">{i.total_qty || (Number(i.home_qty)+Number(i.stall_qty))}</td>
                        {canManage && (
                          <td className="py-3.5 px-3 text-center">
                            <button
                              onClick={() => handleDeleteSingleItem(i)}
                              disabled={isDeleting === i.sku_id}
                              className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs font-black transition active:scale-95 flex items-center justify-center mx-auto gap-1"
                              title="刪除此單項規格"
                            >
                              {isDeleting === i.sku_id ? (
                                <Icons.Refresh className="w-3.5 h-3.5 animate-spin" />
                              ) : (
                                <Icons.Trash className="w-3.5 h-3.5" />
                              )}
                              <span>刪除</span>
                            </button>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          ) : (
            <div className="bg-white rounded-3xl border border-slate-200 p-8 text-center space-y-3">
              <p className="text-slate-400 text-xs font-bold">目前庫存資料庫為空</p>
              {isAdmin && (
                <button onClick={onNavigateToProducts} className="text-xs text-rose-600 font-black hover:underline">
                  + 點此前往新增商品與配置初始庫存 ➔
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 庫存調撥 (Stock Transfer Module)
    // =========================================================================
    function TransferSection({ inventory = [], onTransfer, user }) {
      const [direction, setDirection] = useState('home_to_stall');
      const [quantities, setQuantities] = useState({});
      const [msg, setMsg] = useState('');

      const updateVal = (sku, val, max) => {
        let n = parseInt(val, 10);
        if (isNaN(n) || n < 0) n = 0;
        if (max !== undefined && n > max) n = max;
        setQuantities(p => ({ ...p, [sku]: n }));
      };

      const activeList = Object.keys(quantities).filter(k => quantities[k] > 0).map(k => ({ skuId: k, qty: quantities[k], direction }));

      const submit = async () => {
        if (activeList.length === 0) return;
        const res = await onTransfer({ transfers: activeList, operator: user ? user.name : '工作人員' });
        if (res && res.success) { setMsg('調撥完成！'); setQuantities({}); setTimeout(() => setMsg(''), 3000); }
      };

      if (inventory.length === 0) {
        return (
          <div className="max-w-md mx-auto my-12 p-8 text-center bg-white rounded-3xl border border-slate-200 shadow-card space-y-3">
            <p className="text-slate-400 text-xs font-bold">目前尚無庫存商品可供調撥</p>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto space-y-4">
          <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-card">
            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs w-full sm:w-auto">
              <button
                onClick={() => { setDirection('home_to_stall'); setQuantities({}); }}
                className={`flex-1 sm:flex-none px-5 py-2.5 rounded-lg font-black transition flex items-center justify-center gap-1.5 ${
                  direction === 'home_to_stall' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'
                }`}
              >
                <span>家內出攤至現場</span>
              </button>
              <button
                onClick={() => { setDirection('stall_to_home'); setQuantities({}); }}
                className={`flex-1 sm:flex-none px-5 py-2.5 rounded-lg font-black transition flex items-center justify-center gap-1.5 ${
                  direction === 'stall_to_home' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'
                }`}
              >
                <span>現場撤攤回庫</span>
              </button>
            </div>
            {msg && <span className="text-emerald-600 text-xs font-black flex items-center gap-1"><Icons.Check className="w-4 h-4" />{msg}</span>}
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100 shadow-card">
            {inventory.map(i => {
              const max = direction === 'home_to_stall' ? i.home_qty : i.stall_qty;
              return (
                <div key={i.sku_id} className="p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-2 text-xs">
                  <div>
                    <span className="font-black text-slate-900 text-sm">{i.product_name}</span>
                    <span className="text-blue-600 font-bold ml-1">({i.variant_name})</span>
                    <div className="text-slate-400 text-xs mt-0.5 font-bold">來源可用: {max} 件</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => updateVal(i.sku_id, (quantities[i.sku_id]||0) + 1, max)} disabled={max <= 0} className="px-3 py-2 bg-surface-50 hover:bg-slate-100 rounded-xl border border-slate-200 font-black text-slate-700 text-xs">+1</button>
                    <button onClick={() => updateVal(i.sku_id, (quantities[i.sku_id]||0) + 5, max)} disabled={max <= 0} className="px-3 py-2 bg-surface-50 hover:bg-slate-100 rounded-xl border border-slate-200 font-black text-slate-700 text-xs">+5</button>
                    <button onClick={() => updateVal(i.sku_id, max, max)} disabled={max <= 0} className="px-3 py-2 bg-amber-50 hover:bg-amber-100 rounded-xl border border-amber-200 font-black text-amber-800 text-xs">全部</button>
                    <input type="number" min="0" max={max} value={quantities[i.sku_id]||''} onChange={e => updateVal(i.sku_id, e.target.value, max)} placeholder="0" className="w-20 bg-surface-50 border border-slate-200 rounded-xl py-2 text-center font-black text-slate-900 text-sm focus:outline-none focus:border-rose-400" />
                  </div>
                </div>
              );
            })}
          </div>

          <button
            onClick={submit}
            disabled={activeList.length === 0}
            className="w-full py-4 bg-rose-500 hover:bg-rose-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-black rounded-2xl text-base transition shadow-md flex items-center justify-center gap-2"
          >
            <Icons.Transfer className="w-5 h-5" />
            <span>確認送出調撥 ({activeList.length} 項)</span>
          </button>
        </div>
      );
    }

        setLoading(true);
        try {
          const res = await onFetchTodaySales();
          if (res && res.success) {
            setData(res);

          console.error("載入營收失敗:", e);
        } finally {
          setLoading(false);
        }

      useEffect(() => {
        load();
        const unsub = realtime.subscribeSales((freshData) => {
          if (freshData && freshData.success) {

      const handleVoid = async (oid) => {

                        )}
                      </div>
                    </div>
                  );

              ) : <div className="text-center py-8 text-slate-400 text-xs font-bold">今日尚無銷售交易</div>}
            </div>
          </div>
        </div>
      );
    }

                                <span className="text-emerald-600 font-black">現:{v.stall_qty}</span> | <span className="text-blue-600 font-black">家:{v.home_qty}</span>
                              </div>
                            </div>
                            <button
                              type="button"
                              onClick={() => handleDeleteVariant(v)}
                              className="p-1 text-slate-300 hover:text-rose-600 rounded hover:bg-rose-50 transition"
                              title="刪除此單項規格"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="text-center py-6 text-slate-400 text-xs font-bold">
                目前尚無已建立的商品
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 成員與會員審核系統 (Member & Whitelist Management Module)
    // =========================================================================
    function MemberManageSection({ user, onSyncSheets }) {
      if (!user || user.role !== '系統管理者') {
        return (
          <div className="max-w-md mx-auto my-12 p-8 text-center bg-white rounded-3xl border border-slate-200 shadow-card space-y-4">
            <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto">
              <Icons.Shield className="w-8 h-8 text-rose-600" />
            </div>
            <div>
              <h3 className="text-base font-black text-slate-900">存取權限受限</h3>
              <p className="text-xs text-slate-500 mt-1 leading-relaxed">

      const [syncing, setSyncing] = useState(false);

      useEffect(() => {

          setUsersList(list);

      const handleApprove = async (email, role = '一般使用者') => {

      const handleDelete = async (email) => {

      const handleAddWhitelist = async (e) => {

            setMsg('同步失敗：' + (res?.error || '請檢查 GAS 連線'));

          {msg && (

          {/* 待審核即時處理佇列 (Pending Queue) */}

                <div className="flex items-center gap-2 text-rose-600 font-black text-sm">
                  <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                  <span>發現 {pendingUsers.length} 位成員正在等待攤主核准開通權限：</span>

              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                {pendingUsers.map(u => (
                  <div key={u.email} className="bg-rose-50/60 border border-rose-200 p-4 rounded-2xl flex flex-col justify-between gap-3">
                    <div className="flex items-center gap-3">

              <input

                onChange={e => setNewRole(e.target.value)}

                <option value="編輯者">編輯者 (收銀 + 商品管理)</option>

              </select>
              <button
                type="submit"

              >

                <span className="flex items-center gap-1">
                  <span>加入白名單</span>

            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <div>
                <h3 className="font-black text-slate-900 text-sm">攤位成員權限總覽 ({filteredList.length} 位)</h3>
                <p className="text-xs text-slate-400 mt-0.5">點擊下拉選單可即時調整身分與停用狀態</p>
              </div>

                <input
                  type="text"
                  placeholder="搜尋成員名稱或 Email..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  className="bg-surface-50 border border-slate-200 rounded-xl px-3 py-1.5 font-bold text-slate-800 text-xs w-44 focus:outline-none"
                />

                <select
                  value={filterStatus}
                  onChange={e => setFilterStatus(e.target.value)}
                  className="bg-surface-50 border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold text-slate-700 text-xs"
                >
                  <option value="全部">全部狀態</option>
                  <option value="已核准">已核准</option>
                  <option value="待審核">待審核</option>
                  <option value="已停用">已停用</option>
                </select>

                <select
                  value={filterRole}
                  onChange={e => setFilterRole(e.target.value)}
                  className="bg-surface-50 border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold text-slate-700 text-xs"
                >
                  <option value="全部">全部角色</option>
                  <option value="系統管理者">系統管理者</option>
                  <option value="編輯者">編輯者</option>
                  <option value="一般使用者">一般使用者</option>
                </select>
              </div>
            </div>

            <div className="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">
              {filteredList.length > 0 ? (
                filteredList.map(u => (
