    // =========================================================================
    // 系統設定 ＆ 檔案匯入/匯出 ＆ 全系統一鍵備份 ＆ 清空測試資料
    // =========================================================================
    function SettingsDialog({ onClose, user, onReload, onFullSyncSheets, onClearAllData, inventory, products }) {
      const [importMsg, setImportMsg] = useState('');
      const [syncingAll, setSyncingAll] = useState(false);
      const [allSyncMsg, setAllSyncMsg] = useState('');
      const [isClearing, setIsClearing] = useState(false);
      const configFileRef = useRef(null);

      const handleImportConfigFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const configObj = JSON.parse(event.target.result);
            realtime.importConfigFile(configObj);
            setImportMsg('設定檔匯入成功！系統將自動重新載入...');
            setTimeout(() => {
              onClose();
              onReload();
            }, 1200);
          } catch (err) {
            setImportMsg('JSON 解析失敗，請確認檔案格式是否正確。');
          }
        };
        reader.readAsText(file);
      };

      const handleDownloadConfigBackup = () => {
        const currentConfig = {
          FIREBASE_CONFIG: window.STALL_CONFIG?.FIREBASE_CONFIG || realtime.getFirebaseConfig(),
          GAS_API_URL: realtime.getGasUrl()
        };
        const blob = new Blob([JSON.stringify(currentConfig, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'stall-config.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleFullSync = async () => {
        setSyncingAll(true);
        setAllSyncMsg('');
        try {
          const res = await onFullSyncSheets();
          if (res && res.success) {
            setAllSyncMsg('已將【商品 + 即時庫存 + 今日銷售 + 成員白名單】全數同步備份至 Google 試算表！');
          } else {
            setAllSyncMsg('同步失敗：' + (res?.error || '請檢查 GAS 連線'));
          }
        } catch(e) {
          setAllSyncMsg('同步錯誤：' + e.message);
        } finally {
          setSyncingAll(false);
          setTimeout(() => setAllSyncMsg(''), 6000);
        }
      };

      const handleClearAll = async () => {
        if (!confirm('警告：這將會徹底清空資料庫中「所有商品、庫存與歷史銷售訂單」，重設為完全空白的初始狀態！\n\n您確定要清空嗎？')) return;
        setIsClearing(true);
        try {
          await onClearAllData();
          setImportMsg('已成功清空所有測試資料！');
          setTimeout(() => {
            onClose();
          }, 800);
        } finally {
          setIsClearing(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in">
          <div className="bg-white border border-slate-200 rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            
            <div className="p-4 bg-surface-50 border-b border-slate-200 flex justify-between items-center">
              <h3 className="font-black text-slate-900 text-base flex items-center gap-2">
                <Icons.Products className="w-5 h-5 text-rose-500" />
                <span>後端連線與全系統備份設定</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 p-1">
                <Icons.Close className="w-5 h-5" />
              </button>
            </div>

            <div className="p-5 space-y-4 overflow-y-auto">
              <div className="bg-surface-50 border border-slate-200 p-4 rounded-2xl space-y-2 text-xs">
                <div className="font-black text-slate-900 flex items-center justify-between">
                  <span>當前後端連線狀態：</span>
                  <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                    安全隔離中
                  </span>
                </div>
                <div className="text-slate-600 font-medium">
                  Firebase 專案：<strong className="font-mono text-slate-900">{realtime.getConnectedProjectName()}</strong>
                </div>
                <div className="text-slate-600 font-medium truncate">
                  Google 試算表：<strong className="font-mono text-slate-900">{realtime.getGasUrl() ? '已配置連線 URL' : '未設定'}</strong>
                </div>
              </div>

              {/* 全系統一鍵同步至 Google Sheet */}
              <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2.5">
                <div className="flex items-center gap-2 text-emerald-900 font-black text-xs">
                  <Icons.FileSpreadsheet className="w-4 h-4 text-emerald-600" />
                  <span>Google 試算表日結備份中樞：</span>
                </div>
                <p className="text-[11px] text-emerald-700 leading-relaxed">
                  將 Firebase 最新資料（商品內容、現場/家內庫存、今日銷售單、成員名單）完整覆蓋備份至您的 Google Sheet。
                </p>
                {allSyncMsg && (
                  <div className="p-2 bg-white text-emerald-800 text-[11px] font-bold rounded-xl border border-emerald-200">
                    {allSyncMsg}
                  </div>
                )}
                <button
                  onClick={handleFullSync}
                  disabled={syncingAll}
                  className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2"
                >
                  <Icons.CloudSync className={`w-4 h-4 ${syncingAll ? 'animate-spin' : ''}`} />
                  <span>{syncingAll ? '全系統同步備份中...' : '一鍵全系統完整備份至 Google Sheet'}</span>
                </button>
              </div>

              {/* 一鍵清空所有測試資料 */}
              <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-2 text-xs">
                <div className="font-black text-rose-900 flex items-center gap-2">
                  <Icons.Trash className="w-4 h-4 text-rose-600" />
                  <span>重置與測試資料清理：</span>
                </div>
                <p className="text-[11px] text-rose-700 leading-relaxed">
                  想要重新從 0 開始建立商品與測試點單？點擊下方按鈕將一次清空所有商品、庫存與歷史銷售訂單。
                </p>
                <button
                  onClick={handleClearAll}
                  disabled={isClearing}
                  className="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-2"
                >
                  {isClearing ? <Icons.Refresh className="w-4 h-4 animate-spin" /> : <Icons.Trash className="w-4 h-4" />}
                  <span>一鍵清空所有測試資料（商品、庫存、銷售）</span>
                </button>
              </div>

              {importMsg && (
                <div className="p-3 bg-blue-50 border border-blue-200 text-blue-800 text-xs font-bold rounded-xl">
                  {importMsg}
                </div>
              )}

              <div className="space-y-2 pt-1">
                <input
                  type="file"
                  ref={configFileRef}
                  accept=".json"
                  onChange={handleImportConfigFile}
                  className="hidden"
                />

                <button
                  onClick={() => configFileRef.current?.click()}
                  className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-black rounded-2xl text-xs transition shadow-md flex items-center justify-center gap-2"
                >
                  <Icons.UploadFile className="w-4 h-4" />
                  <span>匯入設定檔 (stall-config.json)</span>
                </button>

                <button
                  onClick={handleDownloadConfigBackup}
                  className="w-full py-3.5 bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 font-black rounded-2xl text-xs transition flex items-center justify-center gap-2"
                >
                  <Icons.DownloadFile className="w-4 h-4" />
                  <span>下載目前設定檔備份 (stall-config.json)</span>
                </button>
              </div>

              <p className="text-[11px] text-slate-400 leading-relaxed text-center">
                提示：您也可以直接把 <code className="bg-slate-100 px-1 py-0.5 rounded font-mono text-slate-700">config.js</code> 與網頁放在同目錄上傳，系統將自動無聲讀取！
              </p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
